<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;color: white;display: flex;justify-content: center;align-items: center;height: 100vh;">
    <div id="time" style="font-size: 50px;">
    </div>
</body>
<script >
    // setInterval() = it execute a code in per milisec (1000 is ms)

const sel = document.querySelector('div')
setInterval(()=>{
    let time = new Date() // it give date and time
    let actualTime = time.toLocaleTimeString("en-us")
    sel.textContent = actualTime
},1000)
</script>
</html>
