<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;color: white;display: flex;justify-content: center;align-items: center;height: 100vh;">
    <div id="'parent">
        <h1>Income Tax Calculator</h1>
        <form>
            <label for="income">Income</label>
            <input type="number" id="income">
            <br></br>
            <button type="submit">Calculate Tax</button>
            <br></br>
            <h2>Total Tax :</h2>
        </form>
    </div>
</body>
<script>
    const sel = document.querySelector('form')
sel.addEventListener('submit',(e)=>{
    e.preventDefault()
    const income =parseInt(document.getElementById('income').value)
    let tax
    if(income<=1200000){
        tax=0
    }    
    else if(income<=1600000){
        tax = (income-1200000)*0.15
    }    
    else if(income<=2000000){
        tax= 400000*0.15 +(income-1600000)*0.20
    }    
    else if(income<=2400000){
        tax = 400000*0.15 + 400000*0.20 + (income-2400000)*0.25
    }
    else{
        tax = 400000*0.15 + 400000*0.20 + 400000*0.25 +(income-2400000)*0.30 
    }
    document.querySelector('h2').textContent=`Total Tax : ${tax}`
    sel.reset()

})
</script>
</html>
