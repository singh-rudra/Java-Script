<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black ; color: red;display: flex; align-items: center;justify-content: center;">
    <div>
        <h1>Love Calculator</h1>
        <form>
            <label for="boy">BOY</label>
            <input type="text" id="boy" required>
            <br></br>
            <label for="girl">GIRL</label>
            <input type="text" id="girl" required>
            <br></br>
            <button type="submit">Calculate</button>
        </form>
        <h2>Result :</h2>
    </div>
    
</body>
<script >
    const sel = document.querySelector('form')
sel.addEventListener('submit',(e)=>{
    e.preventDefault() // it helps to stable the result.
    const boy = document.getElementById('boy')
    const girl = document.getElementById('girl')

    const l1 = boy.value.length
    const l2 = girl.value.length

    const result = Math.pow(l1+l2,3)%101

    document.querySelector('h2').textContent=`Result ${result}`
    sel.reset() // it reset the details.
})    
</script>
</html>
